<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konversi Kecepatan Cerdas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #5c6bc0, #42a5f5);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .dark-mode {
      background: linear-gradient(135deg, #1c1c1c, #333);
      color: white;
    }

    .container {
      max-width: 400px;
      margin: 100px auto 20px;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      transition: background 0.3s;
    }

    .dark-mode .container {
      background: #444;
    }

    h2 {
      margin-bottom: 20px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    .button {
      padding: 12px;
      margin-top: 10px;
      width: 100%;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.3s, transform 0.1s;
      cursor: pointer;
    }

    .button:hover {
      background: #1565c0;
    }

    .button:active {
      transform: scale(0.97);
    }

    #themeToggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: background 0.3s, transform 0.2s;
    }

    #themeToggle:hover {
      background: #f0f0f0;
    }

    #themeToggle:active {
      transform: scale(0.95);
    }

    .dark-mode #themeToggle {
      background: #222;
      color: white;
    }

    #languageSelector {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    #result {
      margin-top: 15px;
      font-size: 1.2em;
      font-weight: bold;
    }

    #history {
      text-align: left;
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.9em;
    }

    .error {
      color: red;
      font-size: 0.85em;
    }

    #clearBtn, #swapBtn {
      margin-top: 10px;
      background-color: #e53935;
    }

    #swapBtn {
      background-color: #43a047;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: inherit;
      background: transparent;
      margin-top: auto;
    }
  </style>
</head>
<body>

<!-- Pilihan Bahasa -->
<select id="languageSelector">
  <option value="id">🇮🇩 Indonesia</option>
  <option value="en">🇬🇧 English</option>
  <option value="zh">🇨🇳 中文</option>
  <option value="ja">🇯🇵 日本語</option>
  <option value="es">🇪🇸 Español</option>
  <option value="fr">🇫🇷 Français</option>
  <option value="tl">🇵🇭 Tagalog</option>
  <option value="ar">🇸🇦 العربية</option>
  <option value="ru">🇷🇺 Русский</option>
</select>


<!-- Tombol Tema -->
<button id="themeToggle">🌙</button>

<!-- Container Utama -->
<div class="container">
  <h2>🚀 Konversi Kecepatan Cerdas</h2>
  <input type="number" id="inputValue" placeholder="Masukkan nilai kecepatan (positif)">
  <div id="errorMsg" class="error" data-msg=""></div>

  <!-- Pilihan Satuan -->
  <select id="fromUnit">
    <option value="kph">Kilometer per jam (KPH)</option>
    <option value="mph">Mil per jam (MPH)</option>
    <option value="knot">Knot</option>
    <option value="ms">Meter per detik (m/s)</option>
  </select>

  <select id="toUnit">
    <option value="mph">Mil per jam (MPH)</option>
    <option value="kph">Kilometer per jam (KPH)</option>
    <option value="knot">Knot</option>
    <option value="ms">Meter per detik (m/s)</option>
  </select>

  <button class="button" id="convertBtn">Konversi</button>
  <button class="button" id="swapBtn">🔁 Tukar Satuan</button>

  <div id="result"></div>

  <div id="history">
    <strong>Riwayat Konversi:</strong>
    <ul id="historyList"></ul>
  </div>

  <button class="button" id="clearBtn">Hapus Riwayat</button>
</div>

<!-- Footer -->
<footer>
  &copy; 2025 Konversi Kecepatan Cerdas. Dibuat dengan ❤️.
</footer>

<!-- JavaScript -->
<script>
  const input = document.getElementById('inputValue');
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  const result = document.getElementById('result');
  const historyList = document.getElementById('historyList');
  const errorMsg = document.getElementById('errorMsg');
  const toggleBtn = document.getElementById('themeToggle');
  const langSelect = document.getElementById('languageSelector');

  const conversionRates = {
    kph: 1,
    mph: 0.621371,
    knot: 0.539957,
    ms: 0.277778
  };

 const translations = {
  id: {
    title: "🚀 Konversi Kecepatan Cerdas",
    placeholder: "Masukkan nilai kecepatan (positif)",
    convertBtn: "Konversi",
    swapBtn: "🔁 Tukar Satuan",
    clearBtn: "Hapus Riwayat",
    resultPrefix: "Hasil",
    historyTitle: "Riwayat Konversi:",
    error: "Masukkan angka positif!"
  },
  en: {
    title: "🚀 Smart Speed Converter",
    placeholder: "Enter speed value (positive)",
    convertBtn: "Convert",
    swapBtn: "🔁 Swap Units",
    clearBtn: "Clear History",
    resultPrefix: "Result",
    historyTitle: "Conversion History:",
    error: "Please enter a positive number!"
  },
  zh: {
    title: "🚀 智能速度转换器",
    placeholder: "输入速度值（正数）",
    convertBtn: "转换",
    swapBtn: "🔁 切换单位",
    clearBtn: "清除记录",
    resultPrefix: "结果",
    historyTitle: "转换记录：",
    error: "请输入正数！"
  },
  ja: {
    title: "🚀 スマート速度変換",
    placeholder: "速度を入力（正の数）",
    convertBtn: "変換",
    swapBtn: "🔁 単位を交換",
    clearBtn: "履歴を消去",
    resultPrefix: "結果",
    historyTitle: "変換履歴：",
    error: "正の数を入力してください！"
  },
  es: {
    title: "🚀 Convertidor de Velocidad Inteligente",
    placeholder: "Ingrese velocidad (número positivo)",
    convertBtn: "Convertir",
    swapBtn: "🔁 Intercambiar unidades",
    clearBtn: "Borrar historial",
    resultPrefix: "Resultado",
    historyTitle: "Historial de conversión:",
    error: "¡Ingrese un número positivo!"
  },
  fr: {
    title: "🚀 Convertisseur de Vitesse Intelligent",
    placeholder: "Entrez la vitesse (nombre positif)",
    convertBtn: "Convertir",
    swapBtn: "🔁 Inverser les unités",
    clearBtn: "Effacer l'historique",
    resultPrefix: "Résultat",
    historyTitle: "Historique des conversions :",
    error: "Veuillez entrer un nombre positif !"
  },
  tl: {
    title: "🚀 Matalinong Speed Converter",
    placeholder: "Ilagay ang bilis (positibong numero)",
    convertBtn: "I-convert",
    swapBtn: "🔁 Palitan ang unit",
    clearBtn: "Burahin ang Kasaysayan",
    resultPrefix: "Resulta",
    historyTitle: "Kasaysayan ng conversion:",
    error: "Pakilagay ang positibong numero!"
  },
  ar: {
    title: "🚀 محول السرعة الذكي",
    placeholder: "أدخل قيمة السرعة (رقم موجب)",
    convertBtn: "تحويل",
    swapBtn: "🔁 تبديل الوحدات",
    clearBtn: "مسح السجل",
    resultPrefix: "النتيجة",
    historyTitle: "سجل التحويل:",
    error: "الرجاء إدخال رقم موجب!"
  },
  ru: {
    title: "🚀 Умный Конвертер Скорости",
    placeholder: "Введите значение скорости (положительное)",
    convertBtn: "Преобразовать",
    swapBtn: "🔁 Поменять единицы",
    clearBtn: "Очистить историю",
    resultPrefix: "Результат",
    historyTitle: "История конверсии:",
    error: "Введите положительное число!"
  }
};

  function updateLanguage(lang) {
    const t = translations[lang];
    document.querySelector("h2").textContent = t.title;
    input.placeholder = t.placeholder;
    document.getElementById("convertBtn").textContent = t.convertBtn;
    document.getElementById("swapBtn").textContent = t.swapBtn;
    document.getElementById("clearBtn").textContent = t.clearBtn;
    document.querySelector("#history strong").textContent = t.historyTitle;
    errorMsg.dataset.msg = t.error;
  }

  langSelect.addEventListener("change", () => {
    updateLanguage(langSelect.value);
  });

  document.getElementById('convertBtn').addEventListener('click', () => {
    const value = parseFloat(input.value);
    if (isNaN(value) || value <= 0) {
      errorMsg.textContent = errorMsg.dataset.msg;
      result.textContent = "";
      return;
    }

    errorMsg.textContent = "";

    let resultValue = value * conversionRates[to.value] / conversionRates[from.value];
    const formatted = resultValue.toFixed(2);
    const lang = langSelect.value;
    const label = translations[lang].resultPrefix;

    result.textContent = `${label}: ${formatted} ${to.value.toUpperCase()}`;

    const now = new Date();
    const waktu = now.toLocaleTimeString();

    const item = document.createElement('li');
    item.textContent = `${value} ${from.value.toUpperCase()} → ${formatted} ${to.value.toUpperCase()} (${waktu})`;
    historyList.prepend(item);

    new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3").play();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    historyList.innerHTML = "";
    result.textContent = "";
  });

  document.getElementById('swapBtn').addEventListener('click', () => {
    const temp = from.value;
    from.value = to.value;
    to.value = temp;
  });

  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle("dark-mode");
    toggleBtn.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
  });

  // Bahasa default
  updateLanguage("id");
</script>

</body>
</html>
