<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konversi Kecepatan Cerdas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <!-- Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #5c6bc0, #42a5f5);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .dark-mode {
      background: linear-gradient(135deg, #1c1c1c, #333);
      color: white;
    }

    .container {
      max-width: 400px;
      margin: 100px auto 20px;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      transition: background 0.3s;
    }

    .dark-mode .container {
      background: #444;
    }

    h2 {
      margin-bottom: 20px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    .button {
      padding: 12px;
      margin-top: 10px;
      width: 100%;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.3s, transform 0.1s;
      cursor: pointer;
    }

    .button:hover {
      background: #1565c0;
    }

    .button:active {
      transform: scale(0.97);
    }

    #themeToggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #fff;
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: background 0.3s, transform 0.2s;
    }

    #themeToggle:hover {
      background: #f0f0f0;
    }

    #themeToggle:active {
      transform: scale(0.95);
    }

    .dark-mode #themeToggle {
      background: #222;
      color: white;
    }

    #result {
      margin-top: 15px;
      font-size: 1.2em;
      font-weight: bold;
    }

    #history {
      text-align: left;
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.9em;
    }

    .error {
      color: red;
      font-size: 0.85em;
    }

    #clearBtn, #swapBtn {
      margin-top: 10px;
      background-color: #e53935;
    }

    #swapBtn {
      background-color: #43a047;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: inherit;
      background: transparent;
      margin-top: auto;
    }
  </style>
</head>
<body>

<!-- Tombol Tema -->
<button id="themeToggle"><i id="themeIcon" class="fas fa-moon"></i></button>

<!-- Container Utama -->
<div class="container">
  <h2>🚀 Konversi Kecepatan Cerdas</h2>
  <input type="number" id="inputValue" placeholder="Masukkan nilai kecepatan (positif)">
  <div id="errorMsg" class="error"></div>

  <!-- Pilihan Satuan -->
  <select id="fromUnit">
    <option value="kph">Kilometer per jam (KPH)</option>
    <option value="mph">Mil per jam (MPH)</option>
    <option value="knot">Knot</option>
    <option value="ms">Meter per detik (m/s)</option>
  </select>

  <select id="toUnit">
    <option value="mph">Mil per jam (MPH)</option>
    <option value="kph">Kilometer per jam (KPH)</option>
    <option value="knot">Knot</option>
    <option value="ms">Meter per detik (m/s)</option>
  </select>

  <button class="button" id="convertBtn">Konversi</button>
  <button class="button" id="swapBtn">🔁 Tukar Satuan</button>

  <div id="result"></div>

  <div id="history">
    <strong>Riwayat Konversi:</strong>
    <ul id="historyList"></ul>
  </div>

  <button class="button" id="clearBtn">Hapus Riwayat</button>
</div>

<!-- JavaScript -->
<script>
  const input = document.getElementById('inputValue');
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  const result = document.getElementById('result');
  const historyList = document.getElementById('historyList');
  const errorMsg = document.getElementById('errorMsg');

  const conversionRates = {
    kph: 1,
    mph: 0.621371,
    knot: 0.539957,
    ms: 0.277778
  };

  document.getElementById('convertBtn').addEventListener('click', () => {
    const value = parseFloat(input.value);
    if (isNaN(value) || value <= 0) {
      errorMsg.textContent = "Masukkan angka positif!";
      result.textContent = "";
      return;
    }

    errorMsg.textContent = "";

    let resultValue = value * conversionRates[to.value] / conversionRates[from.value];
    const formatted = resultValue.toFixed(2);
    result.textContent = `Hasil: ${formatted} ${to.value.toUpperCase()}`;

    const now = new Date();
    const waktu = now.toLocaleTimeString();

    const item = document.createElement('li');
    item.textContent = `${value} ${from.value.toUpperCase()} → ${formatted} ${to.value.toUpperCase()} (${waktu})`;
    historyList.prepend(item);

    new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3").play();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    historyList.innerHTML = "";
    result.textContent = "";
  });

  document.getElementById('swapBtn').addEventListener('click', () => {
    const temp = from.value;
    from.value = to.value;
    to.value = temp;
  });

  // Tombol mode gelap/terang
  const toggleBtn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');

  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle("dark-mode");
    if (document.body.classList.contains("dark-mode")) {
      icon.classList.replace("fa-moon", "fa-sun");
    } else {
      icon.classList.replace("fa-sun", "fa-moon");
    }
  });
</script>

</body>
</html>
